  image: docker:latest
  tags:
    - docker
  resource_group: production_deployment
  environment:
    name: production
    url: https://blog.4me4you.io.vn/
  before_script:
    - apk add --no-cache bash curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
