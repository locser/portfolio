stages:
  - test
  - build
  - deploy

workflow:
  rules:
    # Chỉ chạy pipeline khi push lên nhánh beta hoặc prod
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_BRANCH == "prod"'

variables:
  REGISTRY_IMAGE: "100.93.231.78:5050/out_nha_it/my-blog"

# ==========================================
# Stage 1: Test Job
# ==========================================
test-job:
  stage: test
  image: node:20-alpine
  tags:
    - docker
  script:
    - npm ci
    - npm run test -- --passWithNoTests
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE == "push"'

# ==========================================
# Stage 2: Build and Push Docker Image
# ==========================================
build-job:
  stage: build
  image: docker:latest
  tags:
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
  script:
    # Cài đặt git để dùng git describe
    - apk add --no-cache git
    # Lấy các tag về máy runner để git describe hoạt động chính xác
    - git fetch --tags || true
    # Lấy version tự động qua tag, fallback về package.json version + dev + SHA nếu chưa đánh tag
    - export PKG_VERSION=$(grep -m1 '"version":' package.json | cut -d'"' -f4 || echo "0.0.0")
    - export GIT_DESCRIBE=$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")
    - if echo "$GIT_DESCRIBE" | grep -E -q '^[0-9a-f]{7,40}(-dirty)?$'; then export APP_VERSION="v${PKG_VERSION}-dev-$GIT_DESCRIBE"; else export APP_VERSION="$GIT_DESCRIBE"; fi
    - export BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - echo "Building image version $APP_VERSION for $CI_COMMIT_REF_NAME"
    # Tải bản latest về làm cache nguồn (nếu có)
    - docker pull $REGISTRY_IMAGE:latest || true
    # Build image kèm theo cache-from và các biến thông tin version
    - |
      docker build \
        --cache-from $REGISTRY_IMAGE:latest \
        --build-arg NEXT_PUBLIC_APP_VERSION="$APP_VERSION" \
        --build-arg NEXT_PUBLIC_APP_BUILD_DATE="$BUILD_DATE" \
        --build-arg NEXT_PUBLIC_COMMIT_SHA="$CI_COMMIT_SHORT_SHA" \
        --build-arg NEXT_PUBLIC_BRANCH_NAME="$CI_COMMIT_BRANCH" \
        -t $REGISTRY_IMAGE:$IMAGE_TAG \
        -t $REGISTRY_IMAGE:latest \
        .
    - docker push $REGISTRY_IMAGE:$IMAGE_TAG
    - docker push $REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE == "push"'

# ==========================================
# Stage 3: Deployment Jobs (GitLab Environments)
# ==========================================

# Môi trường Staging (beta branch) - Port 8080
deploy-staging:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  resource_group: staging_deployment
  environment:
    name: staging
    url: http://100.93.231.78:8080
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
    - |
      notify_rollback() {
        echo "Đang gửi cảnh báo lỗi đến Discord..."
        if [ ! -z "$DISCORD_WEBHOOK_URL" ]; then
          chmod +x .gitlab/scripts/notify-discord.sh
          ENV_UPPER=$(echo $CI_ENVIRONMENT_NAME | tr 'a-z' 'A-Z')
          .gitlab/scripts/notify-discord.sh "🚨 [$ENV_UPPER] DEPLOY THẤT BẠI" "15158332" "Hệ thống đã tự động rollback về phiên bản stable cũ." || true
        else
          echo "Không tìm thấy DISCORD_WEBHOOK_URL. Bỏ qua gửi cảnh báo."
        fi
      }
  script:
    - export HOST_PORT=8080
    - export COMPOSE_PROJECT_NAME=my-blog-staging
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    
    # 1. State Backup: Lấy tag hiện tại của container đang chạy ổn định
    - export PREVIOUS_IMAGE=$(docker inspect --format='{{index .Config.Image}}' ${COMPOSE_PROJECT_NAME}-web-1 2>/dev/null || echo "")
    - export PREVIOUS_TAG=${PREVIOUS_IMAGE##*:}
    - echo "Stable version currently running is [$PREVIOUS_TAG]"
    
    # 2. Xử lý xung đột cổng (Chỉ dừng container nếu không thuộc dự án compose này)
    - export BUSY_CONTAINER=$(docker ps -q --filter "publish=$HOST_PORT")
    - export CURRENT_CONTAINER=$(docker compose ps -q web 2>/dev/null || echo "")
    - if [ ! -z "$BUSY_CONTAINER" ] && [ "$BUSY_CONTAINER" != "$CURRENT_CONTAINER" ]; then echo "Stopping conflict container $BUSY_CONTAINER..."; docker stop $BUSY_CONTAINER && docker rm -f $BUSY_CONTAINER; fi
    
    # 3. Pull image mới
    - docker compose pull
    
    # 4. Deploy nóng (Docker Compose tự recreate trong ~1s, không dùng down trước)
    - docker compose up -d
    
    # 5. Kiểm tra Healthcheck vòng lặp (Tương thích POSIX Shell của Runner)
    - export CONTAINER_ID=$(docker compose ps -q web)
    - export SUCCESS=0
    - export i=1
    - |
      while [ $i -le 10 ]; do
        STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
        echo "Container health status: $STATUS (check $i/10)"
        if [ "$STATUS" = "healthy" ]; then
          echo "Deployment successful!"
          SUCCESS=1
          break
        elif [ "$STATUS" = "unhealthy" ]; then
          echo "Container is unhealthy! Boot failed."
          break
        fi
        i=$((i + 1))
        sleep 3
      done
      
    # 6. Xử lý Rollback nếu deploy thất bại
    - |
      if [ $SUCCESS -ne 1 ]; then
        echo "LỖI: Bản deploy mới không vượt qua Health Check!"
        notify_rollback
        if [ ! -z "$PREVIOUS_TAG" ]; then
          echo "Tiến hành Rollback về phiên bản cũ: $PREVIOUS_TAG..."
          export IMAGE_TAG=$PREVIOUS_TAG
          docker compose up -d
          echo "Khôi phục hoàn tất."
        else
          echo "Không tìm thấy phiên bản dự phòng lịch sử. Hệ thống giữ nguyên trạng thái lỗi."
        fi
        exit 1
      fi
      
    # 7. Dọn dẹp đĩa
    - docker container prune -f
    - docker image prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'

