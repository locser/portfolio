# ==========================================
# Stage 4: Auto Tagging (Chỉ chạy sau khi Deploy thành công)
# ==========================================
auto-tagging:
  stage: release
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags:
    - docker
  cache: []
  script:
    - |
      git config --global user.email "gitlab-ci@example.com"
      git config --global user.name "GitLab CI"
      git config --global http.sslVerify false
      export PROTOCOL=$(echo "$CI_SERVER_URL" | cut -d: -f1)
      export HOST_AND_PORT=$(echo "$CI_SERVER_URL" | cut -d/ -f3)
      git remote set-url origin "${PROTOCOL}://oauth2:${GL_TOKEN}@${HOST_AND_PORT}/${CI_PROJECT_PATH}.git"
      git fetch --tags
      if [ -z "$NEXT_TAG" ]; then
        echo "LỖI: Không tìm thấy NEXT_TAG trong biến môi trường!"
        exit 1
      fi
      echo "Tự động tạo tag $NEXT_TAG cho commit $CI_COMMIT_SHORT_SHA"
      git tag -a "$NEXT_TAG" -m "Auto-tagged after successful deploy [skip ci]"
      git push origin "$NEXT_TAG"

  rules:
    - if: '$GL_TOKEN && ($CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "prod") && $CI_PIPELINE_SOURCE == "push"'


