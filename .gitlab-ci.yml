stages:
  - test
  - build
  - deploy

workflow:
  rules:
    # Chỉ chạy pipeline khi push lên nhánh beta hoặc prod
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_BRANCH == "prod"'

variables:
  REGISTRY_IMAGE: "100.93.231.78:5050/out_nha_it/my-blog"

# ==========================================
# Stage 1: Test Job
# ==========================================
test-job:
  stage: test
  image: node:20-alpine
  tags:
    - docker
  script:
    - npm ci
    - npm run test -- --passWithNoTests
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE == "push"'

# ==========================================
# Stage 2: Build and Push Docker Image
# ==========================================
build-job:
  stage: build
  image: docker:latest
  tags:
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
  script:
    # Cài đặt git để dùng git describe
    - apk add --no-cache git
    # Lấy các tag về máy runner để git describe hoạt động chính xác
    - git fetch --tags || true
    # Lấy version tự động qua tag, fallback về package.json version + dev + SHA nếu chưa đánh tag
    - export PKG_VERSION=$(grep -m1 '"version":' package.json | cut -d'"' -f4 || echo "0.0.0")
    - export GIT_DESCRIBE=$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")
    - if echo "$GIT_DESCRIBE" | grep -E -q '^[0-9a-f]{7,40}(-dirty)?$'; then export APP_VERSION="v${PKG_VERSION}-dev-$GIT_DESCRIBE"; else export APP_VERSION="$GIT_DESCRIBE"; fi
    - export BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - echo "Building image version $APP_VERSION for $CI_COMMIT_REF_NAME"
    # Build image kèm theo các biến thông tin version
    - |
      docker build \
        --build-arg NEXT_PUBLIC_APP_VERSION="$APP_VERSION" \
        --build-arg NEXT_PUBLIC_APP_BUILD_DATE="$BUILD_DATE" \
        --build-arg NEXT_PUBLIC_COMMIT_SHA="$CI_COMMIT_SHORT_SHA" \
        --build-arg NEXT_PUBLIC_BRANCH_NAME="$CI_COMMIT_BRANCH" \
        -t $REGISTRY_IMAGE:$IMAGE_TAG \
        -t $REGISTRY_IMAGE:latest \
        .
    - docker push $REGISTRY_IMAGE:$IMAGE_TAG
    - docker push $REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE == "push"'

# ==========================================
# Stage 3: Deployment Jobs (GitLab Environments)
# ==========================================

# Môi trường Staging (beta branch) - Port 8080
deploy-staging:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  resource_group: staging_deployment
  environment:
    name: staging
    url: http://100.93.231.78:8080
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
  script:
    - export HOST_PORT=8080
    - export COMPOSE_PROJECT_NAME=my-blog-staging
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    # Tìm và dừng container bất kỳ đang chiếm port 8080
    - export BUSY_CONTAINER=$(docker ps -q --filter "publish=$HOST_PORT")
    - if [ ! -z "$BUSY_CONTAINER" ]; then echo "Stopping container $BUSY_CONTAINER using port $HOST_PORT..."; docker stop $BUSY_CONTAINER && docker rm -f $BUSY_CONTAINER; fi
    - docker compose down || true
    - docker compose pull
    - docker compose up -d
    # Dọn dẹp các image cũ/dangling để giải phóng ổ đĩa
    - docker image prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'

# Môi trường Production (prod branch) - Port 9080
deploy-production:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  resource_group: production_deployment
  environment:
    name: production
    url: http://100.93.231.78:9080
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
  script:
    - export HOST_PORT=9080
    - export COMPOSE_PROJECT_NAME=my-blog-production
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    # Tìm và dừng container bất kỳ đang chiếm port 9080
    - export BUSY_CONTAINER=$(docker ps -q --filter "publish=$HOST_PORT")
    - if [ ! -z "$BUSY_CONTAINER" ]; then echo "Stopping container $BUSY_CONTAINER using port $HOST_PORT..."; docker stop $BUSY_CONTAINER && docker rm -f $BUSY_CONTAINER; fi
    - docker compose down || true
    - docker compose pull
    - docker compose up -d
    # Dọn dẹp các image cũ/dangling để giải phóng ổ đĩa
    - docker image prune -f
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod" && $CI_PIPELINE_SOURCE == "push"'
