stages:
  - test
  - build
  - deploy

workflow:
  rules:
    # 1. Chặn tất cả các tag push (không chạy pipeline cho tag)
    - if: $CI_COMMIT_TAG
      when: never
    # 2. Chỉ chạy pipeline khi push lên nhánh beta, prod, hoặc main
    - if: '$CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "prod" || $CI_COMMIT_BRANCH == "main"'

variables:
  REGISTRY_IMAGE: "100.93.231.78:5050/out_nha_it/my-blog"

# Stage 1: Chạy Jest Test
test-job:
  stage: test
  image: node:20-alpine
  tags:
    - docker
  script:
    - npm ci
    - npm run test -- --passWithNoTests # Bỏ qua nếu chưa viết test hoặc chạy test cơ bản
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'

    # prod: chỉ chạy khi có MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "prod"'

    # main: chạy khi có MR vào main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "main"'

# Stage 2: Build & Push Docker Image lên GitLab Container Registry
build-job:
  stage: build
  image: docker:latest
  tags:
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050

  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'

    # prod: chỉ chạy khi có MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "prod"'

    # main: chạy khi có MR vào main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "main"'

  script:
    - export APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - export BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
    - docker build --build-arg NEXT_PUBLIC_APP_VERSION="$APP_VERSION" --build-arg NEXT_PUBLIC_APP_BUILD_DATE="$BUILD_DATE" -t $REGISTRY_IMAGE:$CI_COMMIT_SHA -t $REGISTRY_IMAGE:latest .
    - docker push $REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $REGISTRY_IMAGE:latest

# Stage 3: Tự động deploy trên Mac Mini (thông qua host docker.sock)
deploy-job:
  stage: deploy
  image: docker:latest
  tags:
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://100.93.231.78:5050
  
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push"'

    # prod: chỉ chạy khi có MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "prod"'

    # main: chạy khi có MR vào main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_TARGET_BRANCH == "main"'

  script:
    # Xác định cổng và tên project dựa trên nhánh đang chạy
    - if [ "$CI_COMMIT_BRANCH" = "beta" ]; then export HOST_PORT=8080; export COMPOSE_PROJECT_NAME=my-blog-beta; fi
    - if [ "$CI_COMMIT_BRANCH" = "prod" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then export HOST_PORT=9080; export COMPOSE_PROJECT_NAME=my-blog-prod; fi
    - export IMAGE_TAG=$CI_COMMIT_SHA
    # Do runner mount docker.sock của Mac Mini, các lệnh docker compose dưới đây
    # sẽ chạy trực tiếp trên Docker daemon của Mac Mini.
    - docker compose down || true
    - docker compose pull
    - docker compose up -d
