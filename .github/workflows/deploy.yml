name: Deploy Next.js Portfolio to Private Ubuntu Server via Coolify

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Test, and Trigger Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Test Build Production Bundle
        run: npm run build

      - name: Trigger Coolify Redeploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Error: COOLIFY_DEPLOY_WEBHOOK is not set as a GitHub Secret."
            exit 1
          fi
          echo "Triggering Coolify redeployment..."
          curl -i -X GET "$COOLIFY_WEBHOOK"
