name: ci
on:
  push: { branches: [ beta] } # master hiện tại chỉ nên test ở beta.
  pull_request:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}   # ship image khi push (beta), không ship trên PR
          tags: |
            ghcr.io/locser/portfolio:latest
            ghcr.io/locser/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max